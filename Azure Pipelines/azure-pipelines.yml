trigger:
  branches:
    include:
      - qa
  paths:
    exclude:
      - Azure-Pipelines/*

name: $(AppName)_Build_$(MajorReleaseNumber).$(MinorReleaseNumber).$(FixNumber).$(Build.BuildId)

variables:
- group: YAML-DOTNET-VSBUILD-VG
- group: GenAIAdoptionIndex-API-QA-VG
- name: AppName
  value: 'AIRoundTableSecretSharingAPI'
- name: BuildConfiguration
  value: 'Release'
- name: ApiProjectPath
  value: 'AIRoundTableSecretSharingAPI\AIRoundTableSecretSharingAPI.csproj'
- name: PublishFolder
  value: '$(Build.ArtifactStagingDirectory)\publish'

stages:
- stage: CIBuild
  displayName: Build
  jobs:
  - job: Phase_1
    displayName: Build and package
    cancelTimeoutInMinutes: 1
    pool:
      name: $(AgentPoolCI)
      demands:
        - agent.computerName -equals WBGMSTFA1001
    steps:
    - script: echo "Branch is $(Build.SourceBranchName)"
      displayName: Show branch

    - task: CopyFiles@2
      displayName: Copy nuget.config
      inputs:
        SourceFolder: $(OISScriptFolder)
        Contents: 'nuget.config'
        TargetFolder: '$(Build.SourcesDirectory)$(NugetConfigTargetPath)'
        OverWrite: true

    - task: NuGetToolInstaller@0
      displayName: Use NuGet $(NugetVersion)
      inputs:
        versionSpec: '$(NugetVersion)'

    - task: NuGetCommand@2
      displayName: NuGet restore
      inputs:
        command: 'restore'
        restoreSolution: '$(SolutionFileName).sln'
        feedsToUse: 'config'
        nugetConfigPath: '$(NugetConfigPath)'

    # Publish the API project (Common is built via ProjectReference) as plain files
    - task: VSBuild@1
      displayName: Build and publish API (Release, FileSystem)
      inputs:
        solution: '$(ApiProjectPath)'
        configuration: '$(BuildConfiguration)'
        msbuildArgs: >-
          /p:DeployOnBuild=true
          /p:WebPublishMethod=FileSystem
          /p:PublishUrl="$(PublishFolder)"
          /p:DeleteExistingFiles=true
          /p:SkipInvalidConfigurations=false

    # Fail the build if the app files are not at the publish root
    - powershell: |
        $files = Get-ChildItem "$(PublishFolder)" -Filter *.runtimeconfig.json
        if (-not $files) { Write-Error "No .runtimeconfig.json at publish root"; exit 1 }
        if ($files.Count -gt 1) { Write-Error "Multiple apps in publish folder: $($files.Name -join ', ')"; exit 1 }
        Write-Host "Found: $($files.Name)"
      displayName: Verify publish output

    # Zip the folder contents so the DLLs sit at the zip root
    - task: ArchiveFiles@2
      displayName: Zip publish output
      inputs:
        rootFolderOrFile: '$(PublishFolder)'
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: '$(Build.ArtifactStagingDirectory)\$(ArtifactName)'
        replaceExistingArchive: true

    - task: PublishBuildArtifacts@1
      displayName: Publish artifact
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)\$(ArtifactName)'
        ArtifactName: 'drop'